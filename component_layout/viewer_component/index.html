<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <style>
    :root {
      color-scheme: light dark;
      --canvas-bg: #eef1f7;
      --text: #17131f;
      --muted: #3f3949;
      --glass: rgba(255,255,255,.84);
      --glass-strong: rgba(255,255,255,.96);
      --stroke: rgba(58,42,72,.58);
      --accent: #60376f;
      --accent-soft: rgba(214,188,233,.48);
      --shadow: 0 18px 48px rgba(55,42,70,.24);
      --grid-line: rgba(173,216,230,.95);
      --center-line: rgba(37,99,235,1);
      --center-fill: rgba(37,99,235,.10);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --canvas-bg: #15121f;
        --text: #fffaff;
        --muted: #e7deeb;
        --glass: rgba(51,45,70,.88);
        --glass-strong: rgba(61,53,82,.96);
        --stroke: rgba(239,225,248,.46);
        --accent: #e7c4fa;
        --accent-soft: rgba(231,196,250,.26);
        --shadow: 0 20px 58px rgba(2,1,7,.58);
        --grid-line: rgba(173,216,230,.95);
        --center-line: rgba(37,99,235,1);
        --center-fill: rgba(37,99,235,.12);
      }
    }

    /* GLASS REDESIGN: explicit modes override iframe system preference. */
    :root[data-theme="light"] {
      color-scheme: light;
      --canvas-bg: #eef1f7;
      --text: #17131f;
      --muted: #3f3949;
      --glass: rgba(255,255,255,.84);
      --glass-strong: rgba(255,255,255,.96);
      --stroke: rgba(58,42,72,.58);
      --accent: #60376f;
      --accent-soft: rgba(214,188,233,.48);
      --shadow: 0 18px 48px rgba(55,42,70,.24);
      --grid-line: rgba(173,216,230,.95);
      --center-line: rgba(37,99,235,1);
      --center-fill: rgba(37,99,235,.10);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --canvas-bg: #15121f;
      --text: #fffaff;
      --muted: #e7deeb;
      --glass: rgba(51,45,70,.88);
      --glass-strong: rgba(61,53,82,.96);
      --stroke: rgba(239,225,248,.46);
      --accent: #e7c4fa;
      --accent-soft: rgba(231,196,250,.26);
      --shadow: 0 20px 58px rgba(2,1,7,.58);
      --grid-line: rgba(173,216,230,.95);
      --center-line: rgba(37,99,235,1);
      --center-fill: rgba(37,99,235,.12);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin:0;
      padding:0;
      background:transparent;
      color:var(--text);
      overflow:hidden;
      font-family:"Inter","Noto Sans Thai","Leelawadee UI","Segoe UI",system-ui,sans-serif;
      font-size:16px;
      line-height:1.5;
    }

    .wrap {
      position:relative;
      user-select:none;
      width:max-content;
      max-width:100%;
      margin:0 auto;
    }

    canvas {
      border-radius:18px;
      background:var(--canvas-bg);
      border:1px solid var(--stroke);
      box-shadow:var(--shadow);
      cursor:grab;
      display:block;
      touch-action:none;
    }
    canvas:active { cursor:grabbing; }

    .hint {
      position:absolute;
      left:10px;
      bottom:10px;
      padding:7px 11px;
      font-size:13px;
      font-weight:600;
      line-height:1.35;
      color:var(--muted);
      background:var(--glass);
      border:1px solid var(--stroke);
      border-radius:999px;
      backdrop-filter:blur(14px) saturate(1.2);
      -webkit-backdrop-filter:blur(14px) saturate(1.2);
      pointer-events:none;
    }

    .btn {
      min-height:40px;
      padding:9px 13px;
      font-size:13px;
      font-weight:700;
      line-height:1.3;
      color:var(--text);
      background:var(--glass-strong);
      border:1px solid var(--stroke);
      border-radius:14px;
      backdrop-filter:blur(14px) saturate(1.2);
      -webkit-backdrop-filter:blur(14px) saturate(1.2);
      cursor:pointer;
      transition: background .12s ease, border-color .12s ease, transform .06s ease;
    }
    .btn:hover {
      background:var(--accent-soft);
      border-color:var(--accent);
    }
    .btn:active { transform: translateY(1px); }

    .calc-btn {
      position:absolute;
      right:10px;
      top:10px;
      z-index:5;
    }

    .controls {
      position:absolute;
      right:10px;
      bottom:10px;
      z-index:5;
      display:flex;
      gap:10px;
      align-items:flex-end;
      pointer-events:auto;
    }

    .ctrl-card {
      background:var(--glass);
      border:1px solid var(--stroke);
      border-radius:14px;
      padding:8px;
      backdrop-filter:blur(14px) saturate(1.2);
      -webkit-backdrop-filter:blur(14px) saturate(1.2);
      box-shadow:0 10px 28px rgba(0,0,0,.12);
    }

    .ctrl-title {
      color:var(--muted);
      font-size:12px;
      font-weight:800;
      line-height:1.3;
      letter-spacing:.04em;
      margin:0 0 6px 0;
      text-align:center;
    }

    .dpad {
      display:grid;
      grid-template-columns:40px 40px 40px;
      grid-template-rows:40px 40px 40px;
      gap:6px;
      align-items:center;
      justify-items:center;
    }

    .icon-btn,
    .zoom-btn {
      padding:0;
      border-radius:12px;
      line-height:1;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--glass-strong);
      border:1px solid var(--stroke);
      color:var(--text);
      cursor:pointer;
      transition: background .12s ease, border-color .12s ease, transform .06s ease;
    }
    .icon-btn {
      width:40px;
      height:40px;
      font-size:17px;
    }
    .zoom-btn {
      width:46px;
      height:40px;
      font-size:18px;
      font-weight:800;
    }
    .icon-btn:hover,
    .zoom-btn:hover {
      background:var(--accent-soft);
      border-color:var(--accent);
    }
    .icon-btn:active,
    .zoom-btn:active { transform: translateY(1px); }

    .icon-btn.center-dot {
      cursor:default;
      background:rgba(127,127,127,.10);
      color:var(--muted);
    }

    .empty {
      width:40px;
      height:40px;
    }

    .zoom-stack {
      display:flex;
      flex-direction:column;
      gap:6px;
      align-items:center;
    }

    .zoom-readout {
      min-width:44px;
      text-align:center;
      font-size:12px;
      line-height:1.3;
      color:var(--muted);
      font-weight:700;
      margin-top:2px;
    }

    @media (max-width: 360px) {
      .hint { display:none; }
      .controls {
        right:8px;
        bottom:8px;
        gap:6px;
      }
      .ctrl-card { padding:6px; }
      .dpad {
        grid-template-columns:36px 36px 36px;
        grid-template-rows:36px 36px 36px;
      }
      .icon-btn,
      .empty {
        width:36px;
        height:36px;
      }
      .zoom-btn {
        width:42px;
        height:36px;
      }
    }
  </style>
<link rel="stylesheet" href="viewer.css?v=workspace-ux-4"/>
</head>
<body>
  <div class="wrap">
    <canvas id="cv" tabindex="0" aria-label="Microscopy image. Drag to pan, use wheel or plus and minus to zoom."></canvas>

    <div class="hint" id="selectionStatus" role="status">Place a target in the center box, then analyze the selected region.</div>

    <button id="fitBtn" class="btn fit-btn" type="button" title="Fit the full image and reset zoom and position">Fit image</button>
    <button id="calcBtn" class="btn calc-btn" type="button">Analyze selected region</button>

    <!-- New control buttons -->
    <div class="controls">
      <div class="ctrl-card">
        <div class="ctrl-title">INSPECT</div>
        <div class="dpad">
          <div class="empty"></div>
          <button id="panUpBtn" class="icon-btn" type="button" title="Inspect region above" aria-label="Inspect region above">▲</button>
          <div class="empty"></div>

          <button id="panLeftBtn" class="icon-btn" type="button" title="Inspect region to the left" aria-label="Inspect region to the left">◀</button>
          <div class="icon-btn center-dot" title="Center guide">•</div>
          <button id="panRightBtn" class="icon-btn" type="button" title="Inspect region to the right" aria-label="Inspect region to the right">▶</button>

          <div class="empty"></div>
          <button id="panDownBtn" class="icon-btn" type="button" title="Inspect region below" aria-label="Inspect region below">▼</button>
          <div class="empty"></div>
        </div>
      </div>

      <div class="ctrl-card">
        <div class="ctrl-title">ZOOM</div>
        <div class="zoom-stack">
          <button id="zoomInBtn" class="zoom-btn" type="button" title="Zoom in">+</button>
          <button id="zoomOutBtn" class="zoom-btn" type="button" title="Zoom out">−</button>
          <div id="zoomReadout" class="zoom-readout">100%</div>
        </div>
      </div>
    </div>
  </div>

<script>
  // ---- minimal Streamlit component protocol (no React) ----
  function sendMessage(type, data){
    const out = Object.assign({ isStreamlitMessage:true, type:type }, data);
    window.parent.postMessage(out, "*");
  }
  function componentReady(){ sendMessage("streamlit:componentReady", { apiVersion: 1 }); }
  function setFrameHeight(h){ sendMessage("streamlit:setFrameHeight", { height:h }); }
  function setComponentValue(obj){
    // Send only on Calculate click to trigger exactly 1 rerun
    sendMessage("streamlit:setComponentValue", { value: obj, dataType: "json" });
  }

  // Unique token generator: timestamp + random
  function makeCalcToken(){
    const ts = Date.now().toString(36);
    const rnd = Math.random().toString(36).slice(2, 10);
    return ts + "-" + rnd;
  }

  const canvas = document.getElementById("cv");
  const ctx = canvas.getContext("2d");
  const img = new Image();
  const zoomReadout = document.getElementById("zoomReadout");

  // Frontend-only state (NO sending during zoom/pan)
  let vp = 0;
  let imageId = "";
  function markDirty(){
    document.getElementById("selectionStatus").textContent = "Selection changed — Analyze selected region to update results.";
    syncFrameHeight();
  }
  let autoViewport = true;
  let zoom = 1.0, panX = 0.0, panY = 0.0;
  let dragging = false, lastX = 0, lastY = 0;

  // Control tuning
  const AUTO_VIEWPORT_MIN = 280;
  const AUTO_VIEWPORT_MAX = 900;
  const AUTO_VIEWPORT_GUTTER = 4;
  const ZOOM_MIN = 0.15;
  const ZOOM_MAX = 12.0;
  const ZOOM_IN_FACTOR = 1.10;
  const ZOOM_OUT_FACTOR = 1.0 / ZOOM_IN_FACTOR; // ~0.909
  const PAN_STEP_RATIO = 0.06; // 6% of viewport per click

  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

  function cssVar(name, fallback){
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback;
  }

  function computeAutoViewport(){
    const width = Math.floor(document.documentElement.clientWidth || window.innerWidth || 600);
    const usable = Math.max(1, width - AUTO_VIEWPORT_GUTTER);
    const minSize = Math.min(AUTO_VIEWPORT_MIN, usable);
    return Math.round(clamp(usable, minSize, AUTO_VIEWPORT_MAX));
  }

  function updateZoomReadout(){
    const pct = Math.round(zoom * 100);
    zoomReadout.textContent = `${pct}%`;
  }

  function syncFrameHeight(){
    const wrap = document.querySelector(".wrap");
    setFrameHeight(Math.max(vp, Number(wrap.scrollHeight) || vp) + 8);
  }

  function resizeCanvas(newVp, scalePan=false){
    const available = Math.max(
      1,
      Math.floor((document.documentElement.clientWidth || window.innerWidth || 600) - AUTO_VIEWPORT_GUTTER)
    );
    const minSize = Math.min(AUTO_VIEWPORT_MIN, available);
    newVp = Math.round(clamp(Number(newVp) || 600, minSize, AUTO_VIEWPORT_MAX));
    if(newVp === vp) {
      syncFrameHeight();
      return;
    }
    if(scalePan && vp > 0){
      const ratio = newVp / vp;
      panX *= ratio;
      panY *= ratio;
    }
    vp = newVp;
    canvas.width = vp;
    canvas.height = vp;
    canvas.style.width = vp + "px";
    canvas.style.height = vp + "px";

    const wrap = document.querySelector(".wrap");
    wrap.style.width = vp + "px";
    wrap.style.height = vp + "px";

    syncFrameHeight();
    updateZoomReadout();
  }

  function draw(){
    ctx.clearRect(0,0,vp,vp);
    ctx.fillStyle = cssVar("--canvas-bg", "#1c1a29");
    ctx.fillRect(0,0,vp,vp);

    if(!img.complete || !img.naturalWidth || !img.naturalHeight){
      requestAnimationFrame(draw);
      return;
    }

    const w0 = img.naturalWidth, h0 = img.naturalHeight;
    const baseScale = Math.min(vp / w0, vp / h0);
    const scale = baseScale * zoom;

    const cx = vp/2, cy = vp/2;
    const dw = w0 * scale, dh = h0 * scale;
    const dx = cx - dw/2 + panX;
    const dy = cy - dh/2 + panY;

    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(img, dx, dy, dw, dh);

    // 3x3 grid
    const step = vp/3;
    ctx.save();
    ctx.lineWidth = 2;
    ctx.strokeStyle = cssVar("--grid-line", "#ADD8E6");
    for(let i=1;i<=2;i++){
      const p = step*i;
      ctx.beginPath(); ctx.moveTo(p,0); ctx.lineTo(p,vp); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,p); ctx.lineTo(vp,p); ctx.stroke();
    }
    ctx.restore();

    // center cell overlay
    ctx.save();
    ctx.lineWidth = 3;
    ctx.strokeStyle = cssVar("--center-line", "#2563EB");
    ctx.fillStyle = cssVar("--center-fill", "#2563EB1A");
    ctx.beginPath(); ctx.rect(step,step,step,step);
    ctx.fill(); ctx.stroke();
    ctx.restore();

    requestAnimationFrame(draw);
  }

  // Keep point under cursor fixed while zooming (general utility)
  function zoomAboutScreenPoint(mx, my, factor){
    if(!img.complete || !img.naturalWidth || !img.naturalHeight) return;

    const w0 = img.naturalWidth, h0 = img.naturalHeight;
    const baseScale = Math.min(vp / w0, vp / h0);
    const oldScale = baseScale * zoom;

    const cx = vp/2, cy = vp/2;

    // Screen -> image (before zoom)
    const ix = (mx - cx - panX) / oldScale + (w0/2);
    const iy = (my - cy - panY) / oldScale + (h0/2);

    zoom = clamp(zoom * factor, ZOOM_MIN, ZOOM_MAX);

    const newScale = baseScale * zoom;
    // Recompute pan so the same image point stays under the same screen point
    panX = mx - cx - (ix - (w0/2)) * newScale;
    panY = my - cy - (iy - (h0/2)) * newScale;

    updateZoomReadout();
    markDirty();
  }

  function zoomAboutCenter(factor){
    zoomAboutScreenPoint(vp/2, vp/2, factor);
  }

  function panBy(dx, dy){
    panX += dx;
    panY += dy;
    markDirty();
  }

  function panStep(){
    return Math.max(8, Math.round(vp * PAN_STEP_RATIO));
  }

  // Zoom about the fixed ROI center, regardless of pointer position (NO sending).
  function onWheel(e){
    e.preventDefault();
    if(e.deltaY === 0) return;
    const factor = (e.deltaY < 0) ? 1.08 : 1 / 1.08;
    zoomAboutCenter(factor);
  }

  function onDown(e){
    canvas.focus();
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    if (canvas.setPointerCapture) {
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    }
  }

  function onMove(e){
    if(!dragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;
    panX += dx;
    panY += dy;
    markDirty();
  }

  function onUp(){
    dragging = false;
  }

  canvas.addEventListener("wheel", onWheel, { passive:false });
  canvas.addEventListener("pointerdown", onDown);
  canvas.addEventListener("pointermove", onMove);
  canvas.addEventListener("pointerup", onUp);
  canvas.addEventListener("pointercancel", onUp);
  canvas.addEventListener("pointerleave", onUp);

  // ---- Button controls (NEW) ----
  document.getElementById("panLeftBtn").addEventListener("click", () => {
    panBy(panStep(), 0); // move image right => target appears left under center guide
  });

  document.getElementById("panRightBtn").addEventListener("click", () => {
    panBy(-panStep(), 0); // move image left => target appears right
  });

  document.getElementById("panUpBtn").addEventListener("click", () => {
    panBy(0, panStep()); // move image down => target appears up
  });

  document.getElementById("panDownBtn").addEventListener("click", () => {
    panBy(0, -panStep()); // move image up => target appears down
  });

  document.getElementById("zoomInBtn").addEventListener("click", () => {
    zoomAboutCenter(ZOOM_IN_FACTOR);
  });

  document.getElementById("zoomOutBtn").addEventListener("click", () => {
    zoomAboutCenter(ZOOM_OUT_FACTOR);
  });

  document.getElementById("fitBtn").addEventListener("click", () => {
    zoom = 1.0;
    panX = 0;
    panY = 0;
    updateZoomReadout();
    markDirty();
  });

  // Optional keyboard shortcuts when component focused/active
  window.addEventListener("keydown", (e) => {
    // avoid hijacking typing if future inputs exist
    const tag = (document.activeElement && document.activeElement.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea") return;

    const step = panStep();

    switch (e.key) {
      case "ArrowLeft":
        e.preventDefault(); panBy(step, 0); break;
      case "ArrowRight":
        e.preventDefault(); panBy(-step, 0); break;
      case "ArrowUp":
        e.preventDefault(); panBy(0, step); break;
      case "ArrowDown":
        e.preventDefault(); panBy(0, -step); break;
      case "+":
      case "=":
        e.preventDefault(); zoomAboutCenter(ZOOM_IN_FACTOR); break;
      case "-":
      case "_":
        e.preventDefault(); zoomAboutCenter(ZOOM_OUT_FACTOR); break;
      default:
        break;
    }
  });

  // Calculate button: SEND ONCE -> triggers exactly 1 rerun
  document.getElementById("calcBtn").addEventListener("click", () => {
    if(!img.complete || !img.naturalWidth) return;
    document.getElementById("selectionStatus").textContent = "Results use the last analyzed center box.";
    syncFrameHeight();
    const token = makeCalcToken();
    setComponentValue({
      image_id: imageId,
      action: "calculate",
      calc_token: token,
      zoom: zoom,
      panX: panX,
      panY: panY,
      viewport: vp
    });
  });

  // Receive args from Python (render)
  function onRender(event){
    if(event.source !== window.parent || event.data.type !== "streamlit:render") return;
    const args = event.data.args || {};
    imageId = args.image_id || "";

    // Mirror the parent app override; an empty value follows system CSS.
    const requestedTheme = String(args.theme_mode || "System").toLowerCase();
    document.documentElement.dataset.theme =
      requestedTheme === "light" || requestedTheme === "dark"
        ? requestedTheme
        : "";

    const rawViewport = Number(args.viewport);
    autoViewport = !Number.isFinite(rawViewport) || rawViewport <= 0;
    const newVp = autoViewport ? computeAutoViewport() : rawViewport;
    if(newVp !== vp) resizeCanvas(newVp);

    // init from Python only (first load or python reset)
    zoom = Number(args.init_zoom ?? zoom);
    panX = Number(args.init_panX ?? panX);
    panY = Number(args.init_panY ?? panY);
    updateZoomReadout();

    const b64 = args.image_b64 || "";
    img.src = "data:image/png;base64," + b64;
  }

  window.addEventListener("message", onRender);

  let resizeTimer = null;
  function handleViewportResize(){
    if(!autoViewport) return;
    window.clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(() => {
      const nextVp = computeAutoViewport();
      resizeCanvas(nextVp, true);
      markDirty();
    }, 80);
  }
  window.addEventListener("resize", handleViewportResize);
  if("ResizeObserver" in window){
    const ro = new ResizeObserver(handleViewportResize);
    ro.observe(document.documentElement);
  }

  // init
  componentReady();
  resizeCanvas(computeAutoViewport());
  updateZoomReadout();
  requestAnimationFrame(draw);
</script>
</body>
</html>
