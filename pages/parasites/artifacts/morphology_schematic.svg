<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">Artifacts and non-parasitic mimics — Representative non-parasitic mimics</title><desc id="desc">Representative non-parasitic mimics. Refractile air-bubble outline (left); Regular plant-cell walls (right); Budding yeast-like form (below). Illustrative mimics only; no single visual rule excludes a parasite. Schematic, not to scale; not a microscopy image.</desc><rect x="0" y="0" width="900" height="560" fill="#F4F7F2" stroke="none" stroke-width="1"/><text x="32" y="43" font-family="Arial, sans-serif" font-size="16" fill="#58746B">MORPHOLOGY STUDY</text><text x="32" y="83" font-family="Arial, sans-serif" font-size="28" fill="#203C36">Artifacts and non-parasitic mimics</text><text x="32" y="115" font-family="Arial, sans-serif" font-size="18" fill="#58746B">Representative non-parasitic mimics</text><polyline points="32.00,135.00 868.00,135.00" fill="none" stroke="#D3DED5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="140" cy="260" rx="62" ry="62" fill="#FDFDFB" stroke="#90AAB2" stroke-width="7"/><ellipse cx="129" cy="249" rx="43" ry="39" fill="none" stroke="#C6D7DC" stroke-width="3"/><rect x="230" y="220" width="62" height="62" fill="#E7EACD" stroke="#879867" stroke-width="3"/><rect x="294" y="220" width="62" height="62" fill="#E7EACD" stroke="#879867" stroke-width="3"/><rect x="230" y="284" width="62" height="62" fill="#E7EACD" stroke="#879867" stroke-width="3"/><rect x="294" y="284" width="62" height="62" fill="#E7EACD" stroke="#879867" stroke-width="3"/><ellipse cx="190" cy="376" rx="28" ry="20" fill="#E0D5EC" stroke="#7754A0" stroke-width="3"/><ellipse cx="221" cy="360" rx="16" ry="13" fill="#E0D5EC" stroke="#7754A0" stroke-width="3"/><ellipse cx="480" cy="191" rx="15" ry="15" fill="#DCE9F4" stroke="none" stroke-width="1"/><text x="475" y="197" font-family="Arial, sans-serif" font-size="16" fi