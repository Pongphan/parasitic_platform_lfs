<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">Blastocystis spp. — Vacuolar form</title><desc id="desc">Vacuolar form. Large central body; Thin peripheral cytoplasmic rim; Nuclei in the peripheral rim. Other forms occur; preservation changes appearance. Schematic, not to scale; not a microscopy image.</desc><rect x="0" y="0" width="900" height="560" fill="#F4F7F2" stroke="none" stroke-width="1"/><text x="32" y="43" font-family="Arial, sans-serif" font-size="16" fill="#58746B">MORPHOLOGY STUDY</text><text x="32" y="83" font-family="Arial, sans-serif" font-size="28" fill="#203C36">Blastocystis spp.</text><text x="32" y="115" font-family="Arial, sans-serif" font-size="18" fill="#58746B">Vacuolar form</text><polyline points="32.00,135.00 868.00,135.00" fill="none" stroke="#D3DED5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="245" cy="290" rx="114" ry="114" fill="#E3EEF8" stroke="#426FA5" stroke-width="3"/><ellipse cx="245" cy="290" rx="91" ry="91" fill="#FBFCF9" stroke="#AFBFCC" stroke-width="3"/><ellipse cx="335.3910038747084" cy="339.3808304762329" rx="8" ry="8" fill="#EFE7F6" stroke="#7754A0" stroke-width="2"/><ellipse cx="335.3910038747084" cy="339.3808304762329" rx="7" ry="7" fill="#7754A0" stroke="none" stroke-width="1"/><ellipse cx="156.74045840299843" cy="343.0966412976108" rx="8" ry="8" fill="#EFE7F6" stroke="#7754A0" stroke-width="2"/><ellipse cx="156.74045840299843" cy="343.0966412976108" rx="7" ry="7" fill="#7754A0" stroke="none" stroke-width="1"/><ellipse cx="213.3447143922228" cy="191.98498638937986" rx="8" ry="8" fill="#EFE7F6" stroke="#7754A0" stroke-width="2"/><ellipse cx="213.3447143922228" cy="191.98498638937986" rx="7" ry="7" fill="#7754A0" stroke="none" stroke-width="1"/><ellipse cx="480" cy="191" rx="15" ry="15" fill="#DCE9F4" stroke="none" stroke-width="1"/><text x="475" y="197" font-family="Arial, sans-serif" font-size="16" fill="#426FA5">1</text><text x="507" y="198" font-family="Arial, sans-serif" font-size="19" fill="#203C36">Large central body</text><ellipse cx="480" cy="276" rx="15" ry="15" fill="#DCE9F4" stroke="none" stroke-width="1"/><text x="475" y="282" font-family="Arial, sans-serif" font-size="16" fill="#426FA5">2</text><text x="507" y="283" font-family="Arial, sans-serif" font-size="19" fill="#203C36">Thin peripheral cytoplasmic rim</text><ellipse cx="480" cy="361" rx="15" ry="15" fill="#DCE9F4" stroke="none" stroke-width="1"/><text x="475" y="367" font-family="Arial, sans-serif" font-size="16" fill="#426FA5">3</text><text x="507" y="368" font-family="Arial, sans-serif" font-size="19" fill="#203C36">Nuclei in the peripheral rim</text><text x="32" y="475" font-family="Arial, sans-serif" font-size="16" fill="#58746B">Other forms occur; preservation changes appearance.</text><polyline points="32.00,518.00 868.00,518.00" fill="none" stroke="#D3DED5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="32" y="545" font-family="Arial, sans-serif" font-size="15" fill="#58746B">ORIGINAL SCHEMATIC  /  NOT TO SCALE  /  NOT A MICROSCOPY IMAGE</text></svg>
