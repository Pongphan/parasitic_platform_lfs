<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">Iodamoeba buetschlii — Cyst</title><desc id="desc">Cyst. Usually one nucleus; Prominent karyosome; Large glycogen vacuole. Brown shading represents the glycogen mass highlighted by iodine. Schematic, not to scale; not a microscopy image.</desc><rect x="0" y="0" width="900" height="560" fill="#F4F7F2" stroke="none" stroke-width="1"/><text x="32" y="43" font-family="Arial, sans-serif" font-size="16" fill="#58746B">MORPHOLOGY STUDY</text><text x="32" y="83" font-family="Arial, sans-serif" font-size="28" fill="#203C36">Iodamoeba buetschlii</text><text x="32" y="115" font-family="Arial, sans-serif" font-size="18" fill="#58746B">Cyst</text><polyline points="32.00,135.00 868.00,135.00" fill="none" stroke="#D3DED5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="245" cy="290" rx="113" ry="105" fill="#E9F0DD" stroke="#5B7F65" stroke-width="3"/><ellipse cx="194" cy="264" rx="25" ry="25" fill="#EFE7F6" stroke="#7754A0" stroke-width="2"/><ellipse cx="194" cy="264" rx="7" ry="7" fill="#7754A0" stroke="none" stroke-width="1"/><ellipse cx="276" cy="302" rx="52" ry="62" fill="#C09A57" stroke="#8E703A" stroke-width="3"/><ellipse cx="480" cy="191" rx="15" ry="15" fill="#DCE9F4" stroke="none" stroke-width="1"/><text x="475" y="197" font-family="Arial, sans-serif" font-size="16" fill="#426FA5">1</text><text x="507" y="198" font-family="Arial, sans-serif" font-size="19" fill="#203C36">Usually one nucleus</text><ellipse cx="480" cy="276" rx="15" ry="15" fill="#DCE9F4" stroke="none" stroke-width="1"/><text x="475" y="282" font-family="Arial, sans-serif" font-size="16" fill="#426FA5">2</text><text x="507" y="283" font-family="Arial, sans-serif" font-size="19" fill="#203C36">Prominent karyosome</text><ellipse cx="480" cy="361" rx="15" ry="15" fill="#DCE9F4" stroke="none" stroke-width="1"/><text x="475" y="367" font-family="Arial, sans-serif" font-size="16" fill="#426FA5">3</text><text x="507" y="368" font-family="Arial, sans-serif" font-size="19" fill="#203C36">Large glycogen vacuole</text><text x="32" y="475" font-family="Arial, sans-serif" font-size="16" fill="#58746B">Brown shading represents the glycogen mass highlighted by iodine.</text><polyline points="32.00,518.00 868.00,518.00" fill="none" stroke="#D3DED5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="32" y="545" font-family="Arial, sans-serif" font-size="15" fill="#58746B">ORIGINAL SCHEMATIC  /  NOT TO SCALE  /  NOT A MICROSCOPY IMAGE</text></svg>
