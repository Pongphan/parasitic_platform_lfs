<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">Cryptosporidium spp. — Sporulated oocyst</title><desc id="desc">Sporulated oocyst. Round oocyst wall; Four sporozoites; No sporocysts. Sporozoites are enlarged schematically; species are not resolved by oocyst shape. Schematic, not to scale; not a microscopy image.</desc><rect x="0" y="0" width="900" height="560" fill="#F4F7F2" stroke="none" stroke-width="1"/><text x="32" y="43" font-family="Arial, sans-serif" font-size="16" fill="#58746B">MORPHOLOGY STUDY</text><text x="32" y="83" font-family="Arial, sans-serif" font-size="28" fill="#203C36">Cryptosporidium spp.</text><text x="32" y="115" font-family="Arial, sans-serif" font-size="18" fill="#58746B">Sporulated oocyst</text><polyline points="32.00,135.00 868.00,135.00" fill="none" stroke="#D3DED5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="245" cy="290" rx="112" ry="112" fill="#F5E9F0" stroke="#9B6587" stroke-width="4"/><polyline points="198.00,269.00 206.00,249.00 220.00,234.00" fill="none" stroke="#7754A0" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><polyline points="260.00,278.00 268.00,258.00 282.00,243.00" fill="none" stroke="#7754A0" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><polyline points="196.00,335.00 204.00,315.00 218.00,300.00" fill="none" stroke="#7754A0" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><polyline points="265.00,345.00 273.00,325.00 287.00,310.00" fill="none" stroke="#7754A0" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="480" cy="191" rx="15" ry="15" fill="#DCE9F4" stroke="none" stroke-width="1"/><text x="475" y="197" font-family="Arial, sans-serif" font-size="16" fill="#426FA5">1</text><text x="507" y="198" font-family="Arial, sans-serif" font-size="19" fill="#203C36">Round oocyst wall</text><ellipse cx="480" cy="276" rx="15" ry="15" fill="#DCE9F4" stroke="none" stroke-width="1"/><text x="475" y="282" font-family="Arial, sans-serif" font-size="16" fill="#426FA5">2</text><text x="507" y="283" font-family="Arial, sans-serif" font-size="19" fill="#203C36">Four sporozoites</text><ellipse cx="480" cy="361" rx="15" ry="15" fill="#DCE9F4" stroke="none" stroke-width="1"/><text x="475" y="367" font-family="Arial, sans-serif" font-size="16" fill="#426FA5">3</text><text x="507" y="368" font-family="Arial, sans-serif" font-size="19" fill="#203C36">No sporocysts</text><text x="32" y="475" font-family="Arial, sans-serif" font-size="16" fill="#58746B">Sporozoites are enlarged schematically; species are not resolved by oocyst shape.</text><polyline points="32.00,518.00 868.00,518.00" fill="none" stroke="#D3DED5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="32" y="545" font-family="Arial, sans-serif" font-size="15" fill="#58746B">ORIGINAL SCHEMATIC  /  NOT TO SCALE  /  NOT A MICROSCOPY IMAGE</text></svg>
