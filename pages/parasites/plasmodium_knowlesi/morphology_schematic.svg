<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">Plasmodium knowlesi — Band trophozoite and early ring</title><desc id="desc">Band trophozoite and early ring. Band form resembling P. malariae (left); Early ring resembling P. falciparum (right); Erythrocyte context retained. No single illustrated feature confirms P. knowlesi; species can be confused. Schematic, not to scale; not a microscopy image.</desc><rect x="0" y="0" width="900" height="560" fill="#F4F7F2" stroke="none" stroke-width="1"/><text x="32" y="43" font-family="Arial, sans-serif" font-size="16" fill="#58746B">MORPHOLOGY STUDY</text><text x="32" y="83" font-family="Arial, sans-serif" font-size="28" fill="#203C36">Plasmodium knowlesi</text><text x="32" y="115" font-family="Arial, sans-serif" font-size="18" fill="#58746B">Band trophozoite and early ring</text><polyline points="32.00,135.00 868.00,135.00" fill="none" stroke="#D3DED5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="163" cy="283" rx="83" ry="83" fill="#FAE1E3" stroke="#CE949D" stroke-width="3"/><polygon points="91.00,271.00 231.00,279.00 231.00,299.00 91.00,291.00" fill="#B7B5D3" stroke="#426FA5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="192" cy="285" rx="9" ry="9" fill="#EFE7F6" stroke="#7754A0" stroke-width="2"/><ellipse cx="192" cy="285" rx="7" ry="7" fill="#7754A0" stroke="none" stroke-width="1"/><ellipse cx="355" cy="283" rx="66" ry="66" fill="#FAE1E3" stroke="#CE949D" stroke-width="3"/><ellipse cx="354" cy="280" rx="20" ry="20" fill="none" stroke="#426FA5" stroke-width="3"/><ellipse cx="341" cy="265" rx="5" ry="5" fill="#7754A0" stroke="none" stroke-width="1"/><ellipse cx="480" cy="191" rx="15" ry="15" fill="#DCE9F4" stroke="none" stroke-width="1"/><text x="475" y="197" font-family="Arial, sans-serif" font-size="16" fill="#426FA5">1</text><text x="507" y="198" font-family="Arial, sans-serif" font-size="19" fill="#203C36">Band form resembling P.</text><text x="507" y="223" font-family="Arial, sans-serif" font-size="19" fill="#203C36">malariae (left)</text><ellipse cx="480" cy="276" rx="15" ry="15" fill="#DCE9F4" stroke="none" stroke-width="1"/><text x="475" y="282" font-family="Arial, sans-serif" font-size="16" fill="#426FA5">2</text><text x="507" y="283" font-family="Arial, sans-serif" font-size="19" fill="#203C36">Early ring resembling P.</text><text x="507" y="308" font-family="Arial, sans-serif" font-size="19" fill="#203C36">falciparum (right)</text><ellipse cx="480" cy="361" rx="15" ry="15" fill="#DCE9F4" stroke="none" stroke-width="1"/><text x="475" y="367" font-family="Arial, sans-serif" font-size="16" fill="#426FA5">3</text><text x="507" y="368" font-family="Arial, sans-serif" font-size="19" fill="#203C36">Erythrocyte context retained</text><text x="32" y="475" font-family="Arial, sans-serif" font-size="16" fill="#58746B">No single illustrated feature confirms P. knowlesi; species can be confused.</text><polyline points="32.00,518.00 868.00,518.00" fill="none" stroke="#D3DED5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="32" y="545" font-family="Arial, sans-serif" font-size="15" fill="#58746B">ORIGINAL SCHEMATIC  /  NOT TO SCALE  /  NOT A MICROSCOPY IMAGE</text></svg>
